# 仅由 tigao123.com 的 HTTPS VirtualHost 引用，放在原 /api 代理之前。
# 只接入网站后端 5180；执行服务 5280 没有公网代理。
ProxyPass "/api/cpp/" "http://127.0.0.1:5180/api/cpp/" connectiontimeout=5 timeout=30
ProxyPassReverse "/api/cpp/" "http://127.0.0.1:5180/api/cpp/"

# 前端只包含已构建的四个公开文件，不包含后端、配置、日志或备份。
<Directory "/var/www/html/teaching-cpp">
    Options None
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    FallbackResource /teaching-cpp/index.html
    AddDefaultCharset UTF-8
    AddType application/javascript .js
    AddType text/css .css
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    <Files "index.html">
        Header always set Cache-Control "no-cache"
    </Files>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

# 不存在的构建资源返回 404，不能用 HTML 页面冒充 JavaScript 或 CSS。
<Directory "/var/www/html/teaching-cpp/assets">
    FallbackResource disabled
</Directory>

<Directory "/var/www/teaching-cpp-backend">
    Require all denied
</Directory>
<Directory "/var/www/teaching-cpp-runner">
    Require all denied
</Directory>
